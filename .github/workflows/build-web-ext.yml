name: Build web-ext

on:
  push:
    paths:
      - "web-ext/**"
  pull_request:
    paths:
      - "web-ext/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_firefox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: cd web-ext && bun install --frozen-lockfile

      - name: Build for Firefox
        run: cd web-ext && bun run build:firefox

  build_chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: cd web-ext && bun install --frozen-lockfile

      - name: Check
        run: cd web-ext && bun run check
      - name: Build for Chrome
        run: cd web-ext && bun run build
