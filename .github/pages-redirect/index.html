<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://toppings.enry.ch/" />
    <meta http-equiv="refresh" content="0; url=https://toppings.enry.ch/" />
    <title>Toppings has moved</title>
    <script>
      // GitHub Pages serves this file as 404.html too, so deep links keep their path.
      var path = location.pathname.replace(/^\/toppings/, "");
      location.replace("https://toppings.enry.ch" + path + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Toppings has moved to <a href="https://toppings.enry.ch/">toppings.enry.ch</a>.</p>
  </body>
</html>
